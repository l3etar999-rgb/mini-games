<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mini Games</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f1020, #1d1240);
      color: white;
      text-align: center;
    }

    header {
      padding: 25px;
      background: rgba(0, 0, 0, 0.25);
    }

    h1 {
      font-size: 42px;
      color: #a855f7;
    }

    header p {
      margin-top: 10px;
      color: #cfcfe8;
    }

    main {
      padding: 70px 20px;
    }

    h2 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .text {
      color: #bdbdd0;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 16px 28px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: #7c3aed;
    }

    button:hover {
      transform: scale(1.05);
      background: #9333ea;
    }

    footer {
      margin-top: 80px;
      padding: 20px;
      color: #9999b5;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎮 MINI GAMES</h1>
    <p>Play fun games with your friends!</p>
  </header>

  <main>
    <h2>Ready to play? 🔥</h2>

    <p class="text">
      Create a room, invite your friends and start playing.
    </p>
<div id="roomBox" class="room-box" style="display: none;">
  <h3>🎉 الروم تْصايبات!</h3>
  <p>هاهو الكود ديالك، صيفطو لصحابك:</p>

  <div id="roomCode">-----</div>

  <button onclick="copyCode()">📋 كوبي الكود</button>
</div>
    <div class="buttons">
<button onclick="playNow()">▶ Play Now</button>

<button onclick="createRoom()">➕ Create Room</button>

<button onclick="joinRoom()">🔑 Join Room</button>
    </div>
  </main>

  <footer>
    © 2026 Mini Games
  </footer>
<script src="script.js"></script>
</body>
</html>
